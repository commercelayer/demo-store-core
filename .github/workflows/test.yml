name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22.13.0, 22.x, 24.x]

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v5

    - name: Node 🧰
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: Install 📦
      run: npm ci

    - name: Lint 🔎
      run: |
        npm run ts:check
        npm run lint

    - name: Test 🐛 + Coverage 🌈
      run: npm run coverage
